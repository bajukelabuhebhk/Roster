for(let d=1;d<=dd;d++){const k=K(Y,M,d),w=dt(k).getDay();h+=`<tr class="${w==0||w==6?'we':''}"><td>${d}</td><td>${DN[w]}${S.ph.includes(k)?' (PH)':''}</td>`;

function R(){$('ttl').textContent={roster:'Roster',swaps:'Tukar / Lepas Shift',leave:'Cuti',builder:'Builder',settings:'Tetapan'}[tab];({roster:rRoster,swaps:rSwaps,leave:rLeave,builder:rBuilder,settings:rSet})[tab]()}
function rRoster(){let h=`<div class="seg"><button class="${view=='cal'?'on':''}" onclick="view='cal';R()">Calendar</button><button class="${view=='tbl'?'on':''}" onclick="view='tbl';R()">Jadual Rasmi</button></div>`+mnav();
if(view=='cal'){h+=`<div class="card">${calG(k=>({dot:mine(k).length}))}<div class="leg"><i></i> My assigned duties</div></div>`;
if(sel){const ed=!locked();h+=`<div class="card"><b>${DN[dt(sel).getDay()]}, ${sel}</b>${ed?'<div class="tag">Tap satu baris untuk tukar nama</div>':''}`+slots(sel).filter(s=>s!='f').map(s=>{const a=(S.sh[sel]||{})[s]||[];return`<div class="dr" ${ed?`onclick="edit('${sel}','${s}')"`:''}><span>${SN[s]}</span><span>${a.map(n=>`<span class="${n==U?'hl':''}">${n}</span>`).join(' / ')||'-'}</span></div>`}).join('');
if(mine(sel).length)h+=`<button class="p" style="margin-top:10px;width:100%" onclick="ics('${sel}')">Add to My Calendar</button>`;h+='</div>'}}
else{h+=`<div class="row"><span class="tag">${locked()?'Dikunci (hanya melalui Swaps)':'Boleh diedit'}</span><button class="p" onclick="prt()">Cetak / Export PDF</button></div>`;
if(isAdm())h+=`<label class="tag"><input type="checkbox" ${audit?'checked':''} onchange="audit=this.checked;R()"> Bandingkan Roster (Audit View)</label>`;
h+=`<div class="tw card">${table(true,audit&&isAdm(),!locked())}</div>`;if(audit&&isAdm())h+=auditList()}
$('v').innerHTML=h}
function auditList(){const p=ym(Y,M),l=S.log.filter(x=>x.date.startsWith(p));return`<div class="card"><b>Ringkasan Swap / Transfer (${l.length})</b>`+(l.map(x=>`<div class="tag">${x.date} ${SN[x.slot]}: ${x.from} → ${x.to} (${x.type})</div>`).join('')||'<div class="tag">Tiada</div>')+'</div>'}
function edit(k,only){if(locked())return;M_(`<b>${k}${only?' · '+SN[only]:''}</b>`+slots(k).filter(s=>!only||s==only).map(s=>Array.from({length:cnt(s,k)},(_,i)=>{const c=((S.sh[k]||{})[s]||[])[i]||'';return`<div class="tag">${SN[s]} ${i+1}</div><select data-s="${s}" data-i="${i}"><option value="">-</option>${S.staff.filter(n=>s!='e'||S.tpn.includes(n)).map(n=>`<option value="${n}" ${n==c?'selected':''}>${n}${lv(n,k)?' (cuti)':''}</option>`).join('')}</select>`}).join('')).join('')+`<button class="p" onclick="saveE('${k}')">Simpan</button>`)}
function saveE(k){const day={};document.querySelectorAll('#m select').forEach(e=>{const s=e.dataset.s;(day[s]=day[s]||[])[+e.dataset.i]=e.value});
Object.keys(day).forEach(s=>day[s]=day[s].filter(Boolean));const o=S.sh[k]||{};
Object.keys(day).forEach(s=>{(day[s]).forEach((n,i)=>{const a=(o[s]||[])[i];if(a&&a!=n)S.log.push({date:k,slot:s,from:a,to:n,type:'edit'})})});S.sh[k]=Object.assign({},o,day);save();cl();R()}
function snap(){const p=ym(Y,M);if(!S.base[p]){S.base[p]=JSON.parse(JSON.stringify(sub(p)));save()}}
function prt(){const go2=src=>{cl();snap();const p=ym(Y,M);const keep=S.sh,keepB=S.base;
if(src=='base'&&S.base[p]){S.sh=Object.assign({},keep,S.base[p])}
$('pa').innerHTML=`<div style="text-align:center;font-weight:700;font-size:10.5pt;line-height:1.35;margin-bottom:4px">JADUAL TUGAS LEBIH MASA PENOLONG PEGAWAI FARMASI<br>JABATAN FARMASI DAN BEKALAN, HEBHK KLUANG<br>${MS[M].toUpperCase()} ${Y}</div>`+table(false,false,false)+`<p style="font-size:8pt;margin:6px 0">Nota: <b>* Tertakluk kepada bilangan kes semasa</b><br>&nbsp;&nbsp;&nbsp;<b>** Pasif Call:</b> Pengganti kepada Pegawai On Call bila berlaku kecemasan-Kemasukan Wad, Kematian Waris Terdekat, MC dan Bencana Alam</p><div class="sig"><div>Disediakan oleh:<hr>HASIDAH BINTI SARJU<br>Pen. Pegawai Farmasi U7<br>Jabatan Farmasi dan Bekalan</div><div>Disahkan oleh:<hr>PN. PERIANAYAGEE MUNIANDY<br>Ketua Pegawai Farmasi U14<br>Jabatan Farmasi dan Bekalan</div></div><div class="leg">FPD : Farmasi Pesakit Dalam<br>FPL : Farmasi Pesakit Luar<br>FP : Farmasi Pengeluaran<br>DIU Unit Maklumat Ubat</div>`;
S.sh=keep;window.print()};window.pg=go2;
if(isAdm())M_(`<b>Versi cetakan</b><button onclick="pg('base')">Original Baseline</button><button class="p" onclick="pg('cur')">Current Final (Post-Swaps)</button>`);else go2('cur')}
function rLeave(){const L=S.leave[U]=S.leave[U]||{};let h=mnav()+`<div class="card">${calG(k=>({c:L[k]?'lv':''}))}<div class="leg">Kuning = cuti (${U})</div></div>`;
$('v').innerHTML=h;document.querySelectorAll('.cal button').forEach((b,i)=>{b.onclick=()=>{const k=K(Y,M,+b.textContent);sel=k;
if(L[k])M_(`<b>${k} · ${L[k]}</b><button class="d" onclick="setL('${k}')">Batalkan Cuti / Remove Leave</button><button onclick="cl()">Tutup</button>`);
else M_(`<b>${k}</b><button class="p" onclick="setL('${k}','AL')">Annual Leave (AL)</button><button onclick="setL('${k}','Course')">Course</button><button onclick="cl()">Batal</button>`)}})}
function setL(k,t){const L=S.leave[U]=S.leave[U]||{};if(t)L[k]=t;else delete L[k];save();cl();R()}
function rSwaps(){const inc=S.req.filter(r=>r.to==U&&r.st=='pending');let h=mnav()+`<div class="card">${calG(k=>({dot:mine(k).length}))}</div>`;
if(inc.length)h+='<b>Permintaan masuk</b>'+inc.map((r,i)=>`<div class="card"><b>${r.type=='swap'?'Swap Request':'Transfer Request'}</b><div class="tag">${r.from} ${r.type=='swap'?'tukar':'lepas'} ${SN[r.slot]} ${r.date}${r.type=='swap'?' dengan duty anda '+r.rdate+' ('+SN[r.rslot]+')':''}</div><div class="row"><button class="p" onclick="acc(${S.req.indexOf(r)})">Accept</button><button class="d" onclick="dec(${S.req.indexOf(r)})">Decline</button></div></div>`).join('');
if(sel){const m=mine(sel);h+=`<div class="card"><b>${sel}</b>`+(m.map(s=>`<div style="margin-top:8px"><b>${SN[s]}</b><button onclick="swp('${sel}','${s}')">Tukar Shift / Swap</button><button onclick="trf('${sel}','${s}')">Lepas Shift / Transfer Duty</button></div>`).join('')||'<div class="tag">Tiada duty.</div>')+'</div>'}
$('v').innerHTML=h}
const ok=(n,k,s)=>!lv(n,k)&&!slots(k).some(x=>((S.sh[k]||{})[x]||[]).includes(n))&&(s!='e'||S.tpn.includes(n)),free=(n,k,s)=>n!=U&&ok(n,k,s);
function trf(k,s){const c=S.staff.filter(n=>free(n,k,s));M_(`<b>Lepas ${SN[s]} ${k}</b>${c.map(n=>`<button onclick="mk('transfer','${k}','${s}','${n}')">${n}</button>`).join('')||'<div class="tag">Tiada peer layak</div>'}`)}
const peers=(k,s,d)=>slots(d).filter(x=>x!='f').flatMap(x=>(S.sh[d][x]||[]).filter(n=>n!=U&&ok(U,d,x)&&ok(n,k,s)).map(n=>({n,x})));
function swp(k,s){const D=Object.keys(S.sh).filter(d=>d.startsWith(ym(Y,M))&&d!=k).sort().filter(d=>peers(k,s,d).length);
M_(`<b>Tukar ${SN[s]} ${k}</b><div class="tag">1. Pilih tarikh yang anda mahu ganti</div>`+(D.length?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${D.map(d=>`<button onclick="swp2('${k}','${s}','${d}')">${DN[dt(d).getDay()].slice(0,3)} ${+d.slice(8)}/${+d.slice(5,7)}</button>`).join('')}</div>`:'<div class="tag">Tiada tarikh padanan.</div>')+'<button onclick="cl()">Batal</button>')}
function swp2(k,s,d){M_(`<b>Tukar ${k} ↔ ${d}</b><div class="tag">2. Pilih rakan yang boleh bertugas</div>`+peers(k,s,d).map(p=>`<button class="p" onclick="mk('swap','${k}','${s}','${p.n}','${d}','${p.x}')">${p.n} · ${SN[p.x]}</button>`).join('')+`<button onclick="swp('${k}','${s}')">‹ Kembali</button>`)}
function mk(type,date,slot,to,rdate,rslot){S.req.push({type,date,slot,from:U,to,rdate,rslot,st:'pending'});save();cl();alert('Permintaan dihantar kepada '+to);R()}
function rep(k,s,a,b){const arr=S.sh[k][s],i=arr.indexOf(a);if(i>-1)arr[i]=b}
function acc(i){const r=S.req[i];rep(r.date,r.slot,r.from,r.to);S.log.push({date:r.date,slot:r.slot,from:r.from,to:r.to,type:r.type});
if(r.type=='swap'){rep(r.rdate,r.rslot,r.to,r.from);S.log.push({date:r.rdate,slot:r.rslot,from:r.to,to:r.from,type:'swap'})}r.st='accepted';save();R()}
function dec(i){S.req[i].st='declined';save();R()}
function rBuilder(){$('v').innerHTML=mnav()+`<div class="card"><div class="row"><button onclick="if(confirm('Jana semula roster ${MS[M]}? Cuti bridge akan dikecualikan.')){gen(Y,M);save();R()}">Auto-Generate</button><button class="p" onclick="snap();S.pub[ym(Y,M)]=1;save();alert('Diterbitkan & baseline disimpan');R()">Publish</button></div><div class="tag">${S.pub[ym(Y,M)]?'Diterbitkan':'Draf'} · ${S.base[ym(Y,M)]?'Baseline ada':'Tiada baseline'}</div></div><label class="tag"><input type="checkbox" ${audit?'checked':''} onchange="audit=this.checked;R()"> Bandingkan Roster (Audit View)</label><div class="row"><span></span><button class="p" onclick="prt()">Cetak / Export PDF</button></div><div class="tw card">${table(true,audit,true)}</div>${audit?auditList():''}`}
function rSet(){$('v').innerHTML='<div class="card"><b>Layak TPN</b><div class="tag">Tandakan staf yang layak FP/TPN (disimpan ke Supabase)</div>'+S.staff.map(n=>`<label class="row" style="margin-top:8px"><span>${n}</span><input type="checkbox" ${S.tpn.includes(n)?'checked':''} onchange="tpnSet('${n}',this.checked)"></label>`).join('')+'</div>'}
async function tpnSet(n,v){try{await api('staff?name=eq.'+encodeURIComponent(n),{method:'PATCH',body:JSON.stringify({tpn:v})});if(v){if(!S.tpn.includes(n))S.tpn.push(n)}else S.tpn=S.tpn.filter(x=>x!=n)}catch(e){alert(e.message);R()}}
function init(){ensure();$('usr').innerHTML=S.staff.map(n=>`<option ${n==U?'selected':''}>${n}</option>`).join('');nav();R()}

let DP=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;ib('<b>Pasang app Roster HEBHK</b><div class="tag">Buka terus dari skrin utama telefon.</div><button class="p" style="width:100%;margin-top:6px" onclick="ins()">Pasang</button>')});

(async()=>{$('v').innerHTML='<div class="card">Memuatkan data...</div>';try{S=await load();P=snp();try{U=localStorage.getItem('u')||U}catch(e){}if(!S.staff.includes(U))U=S.staff[0];ensure();init();setInterval(poll,15000)}catch(e){$('v').innerHTML='<div class="card">Gagal sambung Supabase: '+e.message+'</div>'}})();
